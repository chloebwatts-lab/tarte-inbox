services:
  inbox:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: 8787
      PUBLIC_BASE_URL: https://inbox.tarte.com.au
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI}
      HELLO_MAILBOX: ${HELLO_MAILBOX:-hello@tarte.com.au}
      TEA_GARDEN_CALENDAR_ID: ${TEA_GARDEN_CALENDAR_ID}
      BEACH_HOUSE_CALENDAR_ID: ${BEACH_HOUSE_CALENDAR_ID}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI}
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-120}
      ENABLE_AUTO_SEND: ${ENABLE_AUTO_SEND:-false}
      ENABLE_AUTO_INVOICE: ${ENABLE_AUTO_INVOICE:-false}
      INVOICE_BUSINESS_NAME: ${INVOICE_BUSINESS_NAME:-}
      INVOICE_ABN: ${INVOICE_ABN:-}
      INVOICE_ADDRESS: ${INVOICE_ADDRESS:-}
      INVOICE_EMAIL: ${INVOICE_EMAIL:-}
      INVOICE_PHONE: ${INVOICE_PHONE:-}
      INVOICE_BANK_ACCOUNT_NAME: ${INVOICE_BANK_ACCOUNT_NAME:-}
      INVOICE_BANK_NAME: ${INVOICE_BANK_NAME:-}
      INVOICE_BANK_BSB: ${INVOICE_BANK_BSB:-}
      INVOICE_BANK_ACCOUNT_NUMBER: ${INVOICE_BANK_ACCOUNT_NUMBER:-}
      INVOICE_LOGO_PATH: ${INVOICE_LOGO_PATH:-}
      INVOICE_GST_REGISTERED: ${INVOICE_GST_REGISTERED:-true}
      INVOICE_NUMBER_PREFIX: ${INVOICE_NUMBER_PREFIX:-TARTE}
      INVOICE_DEPOSIT_DUE_DAYS: ${INVOICE_DEPOSIT_DUE_DAYS:-14}
    volumes:
      # Outgoing attachments (function packs, menus, etc.) bind-mounted from
      # the host so they survive image rebuilds and can be updated without
      # a deploy.
      # Writable so scripts/download-pack.js can save fetched files here.
      # Pipeline.ts only reads; nothing in the live request path writes.
      - ./attachments:/app/attachments
    networks:
      # Joins TK's docker network so TK's Caddy can reverse-proxy here
      # (Caddy routes inbox.tarte.com.au -> inbox:8787) and so we can
      # reach the shared Postgres via the same private network if needed.
      - tartekitchen_default

networks:
  tartekitchen_default:
    external: true
    name: tarte-kitchen_default
